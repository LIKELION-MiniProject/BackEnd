name: API 작업 요청 (API Request)
description: 신규 API 엔드포인트 구현이나 변경을 요청합니다.
title: "[API] "
labels: ["type: API"]
body:
  - type: dropdown
    id: epic
    attributes:
      label: EPIC
      description: 관련된 API 영역을 선택하세요.
      options:
        - AUTH (회원 인증)
        - PROFILE (프로필)
        - COURSE (수강 이력)
        - CERT (졸업 인증)
        - DIAG (졸업 진단)
        - GPA (성적 트렌드)
        - RECO (AI 과목 추천)
        - REQ (졸업 요건 기준)
        - DASH (홈 대시보드)
        - 기타
    validations:
      required: true
  - type: input
    id: endpoint
    attributes:
      label: 엔드포인트
      description: 예) /profiles/{id}/courses
      placeholder: /profiles/{id}/...
    validations:
      required: true
  - type: dropdown
    id: http-method
    attributes:
      label: HTTP 메서드
      options:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
    validations:
      required: true
  - type: dropdown
    id: auth-scope
    attributes:
      label: 권한
      description: 이 API를 호출할 수 있는 대상을 선택하세요.
      options:
        - 회원 전용
        - 비회원 허용
        - 관리자 전용
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: API 설명
      description: 요청/응답 형식과 동작 방식을 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: api-spec-sync
    attributes:
      label: API 명세서(SSOT) 동기화 확인
      description: Notion API 명세서에 이 API가 먼저 반영되었는지, 반영 링크를 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: 추가 참고사항
    validations:
      required: false

name: 버그 리포트 (Bug Report)
description: 백엔드에서 발생한 버그를 신고합니다.
title: "[BUG] "
labels: ["type: 버그"]
body:
  - type: dropdown
    id: bug-category
    attributes:
      label: 버그 카테고리
      description: 버그가 발생한 영역을 선택하세요.
      options:
        - API 오류
        - DB (데이터베이스)
        - 인증 (JWT)
        - AI 연동 (Gemini API)
        - 졸업 진단 계산
        - GPA 계산
        - 기타
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: 심각도
      options:
        - Critical
        - High
        - Medium
        - Low
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: 버그 설명
      description: 어떤 문제가 발생했는지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 버그를 재현하는 단계를 순서대로 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과
      description: 정상적으로 동작했을 때 예상되는 결과를 작성해주세요.
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: 에러 로그 또는 스크린샷
      description: 관련 로그나 스크린샷이 있다면 첨부해주세요.
    validations:
      required: false

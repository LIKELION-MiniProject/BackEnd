name: 작업 (Task)
description: 리팩토링, 환경 설정 등 코드 작업을 등록합니다.
title: "[TASK] "
labels: ["type: 작업"]
body:
  - type: dropdown
    id: task-category
    attributes:
      label: 작업 카테고리
      description: 작업의 유형을 선택하세요.
      options:
        - 리팩토링
        - 환경 세팅
        - 문서화
        - 테스트
        - 성능 최적화
        - 빌드 배포
        - 기타
    validations:
      required: true
  - type: textarea
    id: content
    attributes:
      label: 작업 내용
      description: 수행할 작업을 구체적으로 작성해주세요.
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 필요한 이유
      description: 이 작업이 왜 필요한지 설명해주세요.
    validations:
      required: true
  - type: textarea
    id: checklist
    attributes:
      label: 체크리스트
      description: 작업 완료 기준이 되는 체크리스트를 작성해주세요.
    validations:
      required: false

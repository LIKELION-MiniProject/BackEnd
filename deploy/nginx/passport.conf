# PassPort — nginx 리버스 프록시 설정 (경로 1: 외부 사용자 공개)
#
# 역할: 포트 80으로 들어온 요청을 경로로 나눈다.
#   /api/...  → Spring Boot(:8080)로 프록시  (Spring base가 /api/v1 이라 그대로 전달)
#   그 외     → FE 정적파일(dist) 서빙 + SPA 라우팅 fallback
#
# 같은 출처(http://15.164.84.176/)에서 FE와 API가 모두 제공되므로 CORS·mixed-content가 발생하지 않는다.
#
# 배포 위치: /etc/nginx/sites-available/passport → sites-enabled/ 로 심볼릭 링크
# 자세한 절차: docs/handoff_20260713_B안확정/97_nginx_외부배포_실행가이드.md

server {
    listen 80;
    listen [::]:80;
    server_name 15.164.84.176;

    # FE 빌드 산출물(dist) 위치. /home/ubuntu 아래는 권한 트랩(www-data 접근불가)이 있어
    # /var/www/passport 를 root 로 쓴다. (가이드 문서 참조)
    root /var/www/passport;
    index index.html;

    # 붙여넣기 파싱 등 본문이 커질 수 있어 여유를 둔다.
    client_max_body_size 5m;

    # ── API: Spring Boot로 프록시 ──────────────────────────────
    # location 은 /api/ , proxy_pass 는 경로 없는 형태여야 원본 URI(/api/v1/...)가 그대로 전달된다.
    # (proxy_pass 끝에 / 를 붙이면 /api 가 잘려서 404 가 난다 — 붙이지 말 것)
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # AI 분석(POST)은 최대 60초까지 걸릴 수 있어 프록시 타임아웃을 넉넉히 둔다.
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    # ── FE: 정적파일 + SPA fallback ────────────────────────────
    # 클라이언트 라우팅(예: /dashboard)을 새로고침해도 404 대신 index.html 을 돌려준다.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# MySQL 전환 검증용 프로파일 (feat/mysql 브랜치).
# 실행:  ./gradlew bootRun --args='--spring.profiles.active=mysql'
# 배포 서버(EC2)는 이 파일과 무관하게 H2(application.yml)로 계속 동작한다.
#
# application.yml 을 먼저 로드한 뒤 이 파일이 datasource 부분만 덮어쓴다.
spring:
  datasource:
    # allowPublicKeyRetrieval=true & useSSL=false : MySQL 8 로컬 접속 시 흔한 인증 핸드셰이크 오류 방지
    url: jdbc:mysql://localhost:3306/passportdb?characterEncoding=UTF-8&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&useSSL=false
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 로컬 전용 개발 계정. 운영 시크릿 아님. 필요하면 DB_USERNAME/DB_PASSWORD 환경변수로 덮어쓴다.
    username: ${DB_USERNAME:passport}
    password: ${DB_PASSWORD:passport1234}
  jpa:
    hibernate:
      # 테이블 자동 생성/갱신 (H2와 동일 정책). MySQL 방언은 커넥터로 자동 감지.
      ddl-auto: update
  sql:
    init:
      # H2 전용 MERGE 문법이 든 data.sql 대신 MySQL 문법 시드를 사용한다.
      mode: always
      data-locations: classpath:data-mysql.sql
